<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HLKE0VWCQ3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-HLKE0VWCQ3');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - Taha Merghani</title>
    <meta name="description" content="{{DESCRIPTION}}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --charcoal: #1a1814;
            --warm-black: #0d0b09;
            --cream: #f5f2ed;
            --amber: #d4a853;
            --amber-muted: #b8965a;
            --text-primary: #e8e4de;
            --text-secondary: #9a9590;
            --border: rgba(212, 168, 83, 0.15);
        }

        [data-theme="light"] {
            --warm-black: #f5f2ed;
            --charcoal: #e8e4de;
            --text-primary: #1a1814;
            --text-secondary: #5a5550;
            --cream: #0d0b09;
            --border: rgba(26, 24, 20, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Source Sans 3', sans-serif;
            background-color: var(--warm-black);
            color: var(--text-primary);
            line-height: 1.7;
            font-weight: 300;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        h1, h2, h3 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
        }

        a {
            color: var(--amber);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: var(--cream);
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, var(--warm-black) 0%, transparent 100%);
        }

        .nav-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: 0.05em;
            text-decoration: none;
        }

        .nav-name:hover {
            color: var(--amber);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
        }

        .nav-links a {
            color: var(--text-secondary);
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 400;
        }

        .nav-links a:hover {
            color: var(--amber);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-family: 'Source Sans 3', sans-serif;
            font-weight: 400;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .theme-toggle:hover {
            color: var(--amber);
            border-color: var(--amber);
        }

        /* Article Header */
        .article-header {
            max-width: 800px;
            margin: 0 auto;
            padding: 8rem 2rem 2rem;
        }

        .article-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .article-meta .date {
            color: var(--amber-muted);
        }

        .article-meta a {
            color: var(--amber);
            text-decoration: none;
            border-bottom: 1px solid var(--amber);
        }

        .article-header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1.2;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        .article-description {
            font-size: 1.2rem;
            color: var(--text-secondary);
            line-height: 1.6;
            font-style: italic;
        }

        /* Article Body */
        .article-body {
            max-width: 680px;
            margin: 0 auto;
            padding: 2rem 2rem 8rem;
        }

        .article-body p {
            font-size: 1.15rem;
            line-height: 1.75;
            color: var(--text-primary);
            margin-bottom: 1.75rem;
        }

        .article-body h2 {
            font-size: 2rem;
            margin: 3rem 0 1.5rem;
            color: var(--text-primary);
        }

        .article-body h3 {
            font-size: 1.5rem;
            margin: 2.5rem 0 1rem;
            color: var(--text-primary);
        }

        .article-body h4 {
            font-size: 1.2rem;
            margin: 2rem 0 0.75rem;
            color: var(--text-primary);
        }

        .article-body blockquote {
            border-left: 2px solid var(--amber);
            background: rgba(212, 168, 83, 0.03);
            padding: 2rem;
            margin: 2rem 0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-style: italic;
            color: var(--text-primary);
        }

        .article-body blockquote p:last-child {
            margin-bottom: 0;
        }

        .article-body code {
            background: rgba(212, 168, 83, 0.1);
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.9em;
            color: var(--amber);
        }

        .article-body pre {
            background: var(--charcoal);
            padding: 1.5rem;
            border-radius: 4px;
            overflow-x: auto;
            border: 1px solid var(--border);
            margin: 2rem 0;
        }

        .article-body pre code {
            background: transparent;
            padding: 0;
            color: var(--text-primary);
        }

        .article-body ul, .article-body ol {
            margin: 1.5rem 0 1.5rem 2rem;
            color: var(--text-primary);
        }

        .article-body li {
            margin-bottom: 0.75rem;
            font-size: 1.15rem;
            line-height: 1.75;
        }

        .article-body img {
            max-width: 100%;
            height: auto;
            margin: 2rem 0;
            border-radius: 4px;
        }

        .article-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 3rem 0;
        }

        .article-body a {
            color: var(--amber);
            border-bottom: 1px solid var(--amber);
        }

        .article-body a:hover {
            color: var(--cream);
            border-color: var(--cream);
        }

        /* Back Link */
        .back-link {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        .back-link a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .back-link a:hover {
            color: var(--amber);
        }

        /* Footer */
        footer {
            padding: 3rem 8%;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
            }

            .nav-links {
                display: none;
            }

            .theme-toggle {
                padding: 0.4rem 0.8rem;
                font-size: 0.75rem;
            }

            .article-header {
                padding: 6rem 1.5rem 1.5rem;
            }

            .article-body {
                padding: 1.5rem 1.5rem 6rem;
            }

            .article-body h2 {
                font-size: 1.75rem;
            }

            .article-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>

    <nav>
        <a class="nav-name" href="/">Taha Merghani</a>
        <div style="display:flex;align-items:center;gap:2.5rem;">
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/work/">Work</a>
                <a href="/writing/">Writing</a>
                <a href="/experience/">Experience</a>
                <a href="/about/">About</a>
                <a href="/contact/">Contact</a>
            </div>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                <span id="theme-icon">☀️</span>
            </button>
        </div>
    </nav>

    <article>
        <header class="article-header">
            <div class="article-meta">
                <span class="date">{{DATE}}</span>
                <span class="reading-time">{{READING_TIME}}</span>
            </div>
            <h1>{{TITLE}}</h1>
            <p class="article-description">{{DESCRIPTION}}</p>
            {{MEDIUM_LINK}}
        </header>

        <div class="article-body">
            {{CONTENT}}
        </div>
    </article>

    <div class="back-link">
        <a href="/writing/">← Back to all articles</a>
    </div>

    <footer>
        <p>© 2026 Taha Merghani. Built with intention.</p>
    </footer>

    <script>
        // Reveal on scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        // Theme toggle
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);
        themeIcon.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        themeToggle.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            themeIcon.textContent = next === 'dark' ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
